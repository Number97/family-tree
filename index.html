<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Tree</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f2a22'/%3E%3Cpath d='M16 9v14M9 23v-4h14v4M16 13h0' stroke='%23f6f5f1' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='8' r='3' fill='%23d6b25e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-center" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></symbol>
    <symbol id="i-cake" viewBox="0 0 24 24"><path d="M4 20.5h16M5.5 20.5v-6.5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v6.5M5.5 15.5c2.2 1.4 4.4 1.4 6.5 0s4.3-1.4 6.5 0M12 12V8.5"/><path d="M12 6.2c.8 0 1.4-.6 1.4-1.4 0-1-1.4-2.3-1.4-2.3s-1.4 1.3-1.4 2.3c0 .8.6 1.4 1.4 1.4z" fill="currentColor"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></symbol>
    <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
  </svg>

  <header class="bar">
    <div class="brand">
      <span class="title" id="title">Family Tree</span>
      <span class="sub" id="subtitle"></span>
    </div>
    <div class="search">
      <svg class="i"><use href="#i-search"/></svg>
      <input id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false">
      <div class="results" id="results" hidden></div>
    </div>
    <div class="actions">
      <span class="edit-only status" id="status"></span>
      <button class="edit-only icon" id="undo" title="Undo (⌘Z)" disabled><svg class="i"><use href="#i-undo"/></svg></button>
      <button class="edit-only icon" id="redo" title="Redo (⇧⌘Z)" disabled><svg class="i"><use href="#i-redo"/></svg></button>
      <button class="edit-only publish" id="publish" title="Put the latest version online">Publish</button>
      <button class="icon" id="btn-dates" title="Birthdays"><svg class="i"><use href="#i-cake"/></svg></button>
      <button class="icon" id="btn-center" title="Back to the centre"><svg class="i"><use href="#i-center"/></svg></button>
      <button class="icon" id="btn-settings" title="Settings"><svg class="i"><use href="#i-gear"/></svg></button>
      <button class="icon" id="btn-more" title="More"><svg class="i"><use href="#i-more"/></svg></button>
    </div>
  </header>

  <main id="stage">
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg">
      <style id="svg-style">
        .link{fill:none;stroke:#c8c2b5;stroke-width:1.6;stroke-linejoin:round}
        .couple{stroke:#b3ab9b;stroke-width:2.2;fill:none}
        .couple.ended{stroke-dasharray:2 5;stroke:#d3cdc0;stroke-linecap:round}
        .wed.ended{fill:#bcb5a7;font-weight:500}
        .knot .hit{fill:transparent}
        .knot .dot{fill:#b3ab9b}
        .knot.ended .dot{fill:#f6f5f1;stroke:#cdc6b7;stroke-width:1.5}
        .knot.editable{cursor:pointer}
        .knot.editable:hover .dot{fill:#2f2a22;stroke:#2f2a22}
        .wed{font:600 10px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#a59e8f;text-anchor:middle}
        .person{cursor:pointer}
        .card{fill:#fff;stroke:#e2ddd2;stroke-width:1}
        .person:hover .card{stroke:#c3bba9;filter:drop-shadow(0 3px 8px rgba(38,35,30,.10))}
        .person.center .card{stroke:#d6b25e;stroke-width:1.8}
        .person.sel .card{stroke:#2f2a22;stroke-width:2}
        .av{fill:#a39d91}
        .g-m .av{fill:#5a84b0}
        .g-f .av{fill:#c46f88}
        .ini{font:600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#fff;text-anchor:middle}
        .nm{font:600 13.5px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#26231e}
        .nm.empty{fill:#aaa395;font-style:italic;font-weight:500}
        .yr{font:500 12px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#8a8478}
        .dead .card{fill:#f0eee9;stroke:#dcd7cc}
        .dead .av{fill:#c2bdb3}
        .dead.g-m .av{fill:#a9bdd3}
        .dead.g-f .av{fill:#dcb0bd}
        .dead .nm{fill:#57524a}
        .dead .yr{fill:#958f83}
        .chip{cursor:pointer}
        .chip rect{fill:#fff;stroke:#cfc8b9}
        .chip:hover rect{fill:#f2efe8}
        .chip text{font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#6c675e;text-anchor:middle}
        .ctl{opacity:0;transition:opacity .15s;cursor:pointer}
        .ctl.show,.ctl:hover{opacity:1}
        .ctl circle{fill:#fff;stroke:#bdb5a5}
        .ctl path{stroke:#6c675e;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
        .add{opacity:0;transition:opacity .12s;cursor:pointer}
        .person:hover .add,.person.sel .add{opacity:1}
        .add circle{fill:#2f2a22}
        .add:hover circle{fill:#4f7cac}
        .add path{stroke:#fff;stroke-width:2;stroke-linecap:round}
        .link.fam{stroke-width:1.9;stroke-opacity:.8}
        .open{opacity:0;transition:opacity .12s;cursor:pointer}
        .open rect{fill:#fff;stroke:#d8d2c6}
        .open path{fill:#7a7366}
        .open .ring{fill:none;stroke:#7a7366;stroke-width:1.4}
        .open .ib{stroke:#7a7366;stroke-width:1.6;stroke-linecap:round;fill:none}
        .open:hover rect{fill:#2f2a22;stroke:#2f2a22}
        .open:hover path,.open:hover .ib{fill:#fff;stroke:#fff}
        .open:hover .ring{stroke:#fff}
        .person:hover .open{opacity:1}
        .hb{opacity:0;transition:opacity .12s;cursor:pointer;pointer-events:none}
        .person.can-hide:hover .hb{opacity:1;pointer-events:auto}
        .hb circle{fill:#fff;stroke:#bdb5a5}
        .hb path{stroke:#6c675e;stroke-width:2;stroke-linecap:round}
        .hb:hover circle{fill:#b4483c;stroke:#b4483c}
        .hb:hover path{stroke:#fff}
        .nm2{display:none}
        .nm2 text{font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#26231e}
        .dead .nm2 text{fill:#57524a}
        .c-dot{display:none}
        .c-dot circle{fill:#9a9488}
        .g-m .c-dot circle{fill:#5a84b0}
        .g-f .c-dot circle{fill:#c46f88}
        .dead .c-dot circle{fill:#c2bdb3}
        .dead.g-m .c-dot circle{fill:#a9bdd3}
        .dead.g-f .c-dot circle{fill:#dcb0bd}
        .c-dot text{font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;fill:#fff;text-anchor:middle}
        .lod-mid .c-full{display:none}
        .lod-mid .nm2{display:inline}
        .lod-dot .c-full,.lod-dot .card,.lod-dot .av,.lod-dot .ini,.lod-dot .nm2{display:none}
        .lod-dot .c-dot{display:inline}
        .lod-dot.center .c-dot circle,.lod-dot.sel .c-dot circle{stroke:#d6b25e;stroke-width:4}
        .anim .person{transition:transform .48s cubic-bezier(.33,1,.68,1),opacity .35s}
        .person.enter{opacity:0}
        #links,#ctls{transition:opacity .3s .25s}
        #links.fresh,#ctls.fresh{opacity:0;transition:none}
        .person,.link,.couple,.knot,.chip,.wed{transition:opacity .15s}
        .dim .person:not(.hl){opacity:.22}
        .dim .link:not(.hl),.dim .couple:not(.hl),.dim .knot:not(.hl),.dim .wed:not(.hl),.dim .chip{opacity:.12}
        .dim .link.hl{stroke-width:2.6;stroke-opacity:1}
        .flash .card{animation:ft-flash 1.4s ease-out}
        @keyframes ft-flash{0%,40%{stroke:#d6b25e;stroke-width:5}100%{stroke-width:1}}
      </style>
      <g id="viewport">
        <g id="links"></g>
        <g id="nodes"></g>
        <g id="ctls"></g>
      </g>
    </svg>
    <div class="zoom">
      <button class="icon" id="zoom-in" title="Zoom in"><svg class="i"><use href="#i-plus"/></svg></button>
      <button class="icon" id="zoom-out" title="Zoom out"><svg class="i"><use href="#i-minus"/></svg></button>
    </div>
    <div class="back" id="back" hidden><button id="back-btn"></button></div>
    <div class="message" id="message" hidden></div>
  </main>

  <div id="panel" class="overlay" hidden><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
  <div id="popover" class="popover" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="tip" class="tip" hidden></div>

  <script src="assets/model.js"></script>
  <script src="assets/layout.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
